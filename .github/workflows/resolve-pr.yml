name: controlled ref-resolution proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  prove:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/test-ref-resolution'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current PR head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);

      - name: Checkout using only the PR branch name
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          persist-credentials: false

      - name: Execute checked-out proof script
        env:
          CONTROLLED_CANARY: ${{ secrets.CONTROLLED_CANARY }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
        run: python3 proof.py

      - name: Upload non-secret proof
        uses: actions/upload-artifact@v4
        with:
          name: ref-resolution-proof
          path: proof.json
